name: CI/CD

on:
    push:
        branches: [master]
    workflow_dispatch:

env:
    BUN_VERSION: '1'

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: Install dependencies
              run: bun install --frozen-lockfile --ignore-scripts

            - name: Lint
              run: bun x eslint "src/**/*.{js,jsx,ts,tsx}" --max-warnings 0

            - name: Build check
              run: bun run build

    deploy:
        name: Deploy (Docker Compose)
        needs: lint
        runs-on: ubuntu-latest
        steps:
            - name: Deploy via SSH
              uses: appleboy/ssh-action@v1.2.0
              with:
                  host: ${{ secrets.DEPLOY_HOST }}
                  username: ${{ secrets.DEPLOY_USER }}
                  port: 22
                  key: ${{ secrets.DEPLOY_SSH_KEY }}
                  command_timeout: 60m
                  script_stop: true
                  script: |
                      set -euo pipefail
                      TARGET="/var/www/company-mrp/web-company-mrp"
                      cd "$TARGET"
                      sudo git config --global --add safe.directory "$TARGET" 2>/dev/null || true
                      sudo git fetch origin master
                      sudo git reset --hard origin/master
                      sudo docker compose --env-file .env.local up -d --build
                      sudo docker image prune -f --filter "label=com.docker.compose.project=mrp-law-fe"