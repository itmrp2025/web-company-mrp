# ─── HTTP → HTTPS redirect ───────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name dev.mrplawoffice.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS ───────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.mrplawoffice.com;

    # SSL — diisi otomatis oleh Certbot; sebelum cert ada, comment blok ini
    ssl_certificate     /etc/letsencrypt/live/dev.mrplawoffice.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.mrplawoffice.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;

    # Security headers (Next.js juga kirim sebagian via next.config.ts — hindari duplikasi)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header X-Frame-Options           "DENY"                                always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # Batas upload (admin CMS)
    client_max_body_size 10M;

    # Proxy ke Next.js container
    location / {
        proxy_pass         http://127.0.0.1:3003;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
        proxy_connect_timeout 10s;
    }

    # Cache agresif Next.js static assets (nama file sudah mengandung content hash)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3003;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public files — favicon, robots.txt, og-image, dll.
    location /public/ {
        proxy_pass http://127.0.0.1:3003;
        add_header Cache-Control "public, max-age=3600";
    }
}
