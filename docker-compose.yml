services:
  web:
    container_name: mrp-law-fe
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_KEY: ${NEXT_PUBLIC_KEY}
    env_file:
      - .env.local
    ports:
      - "127.0.0.1:3001:3000"
    restart: unless-stopped
